name: Actualizar noticias diarias

on:
  schedule:
    # 08:00 UTC = 10:00 en España en horario de verano (CEST).
    # En horario de invierno (CET) esto equivale a las 09:00 en España.
    - cron: '0 8 * * *'
  workflow_dispatch: {}   # permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar página con noticias del día
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: node fetch-news.js

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet --cached || git commit -m "Actualización automática de noticias $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

