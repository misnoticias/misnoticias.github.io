<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noticias del Día</title>

<!--
  ============================================================
  Cuando Google AdSense apruebe tu cuenta, pega aquí el script
  que te den, sustituyendo ca-pub-XXXXXXXXXXXXXXXX por tu ID:

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
   crossorigin="anonymous"></script>
  ============================================================
-->

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f6fa;
    color: #2d2d2d;
    line-height: 1.6;
  }
  header {
    background: #1a1a2e;
    color: #fff;
    padding: 25px 20px;
    text-align: center;
  }
  header p { opacity: 0.8; font-size: 14px; margin-top: 6px; }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }
  .ad-slot {
    background: #e8e8e8;
    border: 2px dashed #aaa;
    text-align: center;
    padding: 25px 10px;
    margin: 20px 0;
    color: #777;
    font-size: 13px;
    border-radius: 8px;
  }
  .news-card {
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 18px;
  }
  .news-card img {
    width: 100%; max-height: 260px; object-fit: cover;
    border-radius: 6px; margin-bottom: 12px;
  }
  .news-card h2 { font-size: 19px; color: #1a1a2e; margin-bottom: 8px; }
  .news-card .meta { font-size: 12px; color: #999; margin-bottom: 10px; }
  .news-card p { font-size: 14px; margin-bottom: 10px; }
  .news-card a {
    display: inline-block; font-size: 13px; font-weight: 600;
    color: #2454ff; text-decoration: none;
  }
  footer { text-align: center; padding: 20px; color: #999; font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>📰 Noticias del Día</h1>
  <p>Última actualización: {{UPDATED_DATE}}</p>
</header>

<div class="container">

  <div class="ad-slot">[ Bloque de anuncio AdSense #1 ]</div>

  {{NEWS_CONTENT}}

  <div class="ad-slot">[ Bloque de anuncio AdSense #2 ]</div>

</div>

<footer>
  <p>&copy; 2026 Noticias del Día. Contenido agregado de fuentes públicas, todos los derechos de las noticias pertenecen a sus autores originales.</p>
</footer>

</body>
</html>
